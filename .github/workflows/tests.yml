name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile-check all scripts
        run: python3 -m py_compile *.py tests/*.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
        # data/restaurant-analysis/restaurant_data.json is gitignored
        # (~50MB, regenerated via download_data.py) and isn't fetched in
        # this workflow, so the tests that need it (TestFullPipelineRegression,
        # TestTemperatureCodesAreCaught) skip automatically here -- everything
        # else (the synthetic-data and hand-built-example tests, which are
        # most of the suite) runs for real on every push.
