name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# This workflow only reads the repo and runs tests -- it never needs to
# write anything back, so GITHUB_TOKEN gets the minimum permission rather
# than the (broader) default. Flagged by CodeQL's actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile-check all scripts
        run: python3 -m py_compile *.py tests/*.py data/restaurant-analysis/*.py supabase/*.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
        # data/restaurant-analysis/restaurant_data.json is gitignored
        # (~270MB, regenerated via download_data.py) and isn't fetched in
        # this workflow, so the tests that need it (TestFullPipelineRegression,
        # TestTemperatureCodesAreCaught) skip automatically here -- everything
        # else (the synthetic-data and hand-built-example tests, which are
        # most of the suite) runs for real on every push.
